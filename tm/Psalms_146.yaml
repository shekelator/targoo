  text: 'Hallelujah! Praise the LORD, O my soul.

    I will praise the LORD as long as I live; I will sing to my God all my days.

    Do not trust in princes, in any mortal, who cannot save.

    When his breath departs, he returns to the earth; on that day his plans perish.

    Blessed is he whose help is the God of Jacob, whose hope is in the LORD his God—

    the maker of heaven and earth, the sea and all that is in them, who keeps faith
    forever;

    who executes justice for the oppressed, who gives food to the hungry. The LORD
    sets prisoners free.

    The LORD opens the eyes of the blind; the LORD lifts up those who are bowed down;
    the LORD loves the righteous.

    The LORD watches over the stranger; he upholds the orphan and the widow, but he
    thwarts the way of the wicked.

    The LORD reigns forever — your God, O Zion, for all generations. Hallelujah!'
