hebrew: 'הַֽלְלוּ־יָהּ הַֽלְלִי נַפְשִׁי אֶת־יְהֹוָֽה׃

  אֲהַלְלָה יְהֹוָה בְּחַיָּי אֲזַמְּרָה לֵאלֹהַי בְּעוֹדִֽי׃

  אַל־תִּבְטְחוּ בִנְדִיבִים בְּבֶן־אָדָם שֶׁאֵין לוֹ תְשׁוּעָֽה׃

  תֵּצֵא רוּחוֹ יָשֻׁב לְאַדְמָתוֹ בַּיּוֹם הַהוּא אָבְדוּ עֶשְׁתֹּנֹתָֽיו׃

  אַשְׁרֵי שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ שִׂבְרוֹ עַל־יְהֹוָה אֱלֹהָֽיו׃

  עֹשֶׂה שָׁמַיִם וָאָרֶץ אֶת־הַיָּם וְאֶת־כׇּל־אֲשֶׁר־בָּם הַשֹּׁמֵר אֱמֶת לְעוֹלָֽם׃

  עֹשֶׂה מִשְׁפָּט לָעֲשׁוּקִים נֹתֵן לֶחֶם לָרְעֵבִים יְהֹוָה מַתִּיר אֲסוּרִֽים׃

  יְהֹוָה פֹּקֵחַ עִוְרִים יְהֹוָה זֹקֵף כְּפוּפִים יְהֹוָה אֹהֵב צַדִּיקִֽים׃

  יְהֹוָה שֹׁמֵר אֶת־גֵּרִים יָתוֹם וְאַלְמָנָה יְעוֹדֵד וְדֶרֶךְ רְשָׁעִים יְעַוֵּֽת׃

  יִמְלֹךְ יְהֹוָה לְעוֹלָם אֱלֹהַיִךְ צִיּוֹן לְדֹר וָדֹר הַֽלְלוּ־יָֽהּ׃ {פ}'
