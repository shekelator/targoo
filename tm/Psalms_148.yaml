  text: 'Hallelujah! Praise the LORD from the heavens; praise him in the heights.

    Praise him, all his angels; praise him, all his hosts.

    Praise him, sun and moon; praise him, all you shining stars.

    Praise him, highest heavens, and the waters above the skies.

    Let them praise the name of the LORD, for he commanded and they were created.

    He set them in place forever and ever; he gave a decree that will not pass away.

    Praise the LORD from the earth, you sea creatures and all the depths,

    fire and hail, snow and mist, stormy wind that does his bidding,

    mountains and all hills, fruit trees and all cedars,

    wild animals and all livestock, crawling things and winged birds,

    kings of the earth and all peoples, princes and all rulers of the earth,

    young men and women alike, old and young together.

    Let them praise the name of the LORD, for his name alone is exalted; his majesty
    is above earth and heaven.

    He has raised up a horn for his people, praise for all his faithful ones, for
    the children of Israel, the people close to him. Hallelujah!'
