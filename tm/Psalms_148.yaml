hebrew: 'הַלְלוּ־יָהּ הַֽלְלוּ אֶת־יְהֹוָה מִן־הַשָּׁמַיִם הַֽלְלוּהוּ בַּמְּרוֹמִֽים׃

  הַֽלְלוּהוּ כׇל־מַלְאָכָיו הַלְלוּהוּ כׇּל־צְבָאָֽו׃

  הַֽלְלוּהוּ שֶׁמֶשׁ וְיָרֵחַ הַֽלְלוּהוּ כׇּל־כּוֹכְבֵי אֽוֹר׃

  הַֽלְלוּהוּ שְׁמֵי הַשָּׁמָיִם וְהַמַּיִם אֲשֶׁר מֵעַל הַשָּׁמָֽיִם׃

  יְֽהַלְלוּ אֶת־שֵׁם יְהֹוָה כִּי הוּא צִוָּה וְנִבְרָֽאוּ׃

  וַיַּעֲמִידֵם לָעַד לְעוֹלָם חׇק־נָתַן וְלֹא יַעֲבֽוֹר׃

  הַֽלְלוּ אֶת־יְהֹוָה מִן־הָאָרֶץ תַּנִּינִים וְכׇל־תְּהֹמֽוֹת׃

  אֵשׁ וּבָרָד שֶׁלֶג וְקִיטוֹר רוּחַ סְעָרָה עֹשָׂה דְבָרֽוֹ׃

  הֶהָרִים וְכׇל־גְּבָעוֹת עֵץ פְּרִי וְכׇל־אֲרָזִֽים׃

  הַחַיָּה וְכׇל־בְּהֵמָה רֶמֶשׂ וְצִפּוֹר כָּנָֽף׃

  מַלְכֵי־אֶרֶץ וְכׇל־לְאֻמִּים שָׂרִים וְכׇל־שֹׁפְטֵי אָֽרֶץ׃

  בַּחוּרִים וְגַם־בְּתוּלוֹת זְקֵנִים עִם־נְעָרִֽים׃

  יְהַלְלוּ אֶת־שֵׁם יְהֹוָה כִּֽי־נִשְׂגָּב שְׁמוֹ לְבַדּוֹ הוֹדוֹ עַל־אֶרֶץ וְשָׁמָֽיִם׃

  וַיָּרֶם קֶרֶן לְעַמּוֹ תְּהִלָּה לְֽכׇל־חֲסִידָיו לִבְנֵי יִשְׂרָאֵל עַם קְרֹבוֹ
  הַֽלְלוּ־יָֽהּ׃ {פ}'
