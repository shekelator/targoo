hebrew: 'לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃

  הַשָּׁמַיִם מְֽסַפְּרִים כְּבֽוֹד־אֵל וּֽמַעֲשֵׂה יָדָיו מַגִּיד הָרָקִֽיעַ׃

  יוֹם לְיוֹם יַבִּיעַֽ אֹמֶר וְלַיְלָה לְּלַיְלָה יְחַוֶּה־דָּֽעַת׃

  אֵֽין־אֹמֶר וְאֵין דְּבָרִים בְּלִי נִשְׁמָע קוֹלָֽם׃

  בְּכׇל־הָאָרֶץ יָצָא קַוָּם וּבִקְצֵה תֵבֵל מִלֵּיהֶם לַשֶּׁמֶשׁ שָֽׂם־אֹהֶל בָּהֶֽם׃

  וְהוּא כְּחָתָן יֹצֵא מֵחֻפָּתוֹ יָשִׂישׂ כְּגִבּוֹר לָרוּץ אֹֽרַח׃

  מִקְצֵה הַשָּׁמַיִם מֽוֹצָאוֹ וּתְקוּפָתוֹ עַל־קְצוֹתָם וְאֵין נִסְתָּר מֵחַמָּתֽוֹ׃

  תּוֹרַת יְהֹוָה תְּמִימָה מְשִׁיבַת נָפֶשׁ עֵדוּת יְהֹוָה נֶאֱמָנָה מַחְכִּימַת
  פֶּֽתִי׃

  פִּקּוּדֵי יְהֹוָה יְשָׁרִים מְשַׂמְּחֵי־לֵב מִצְוַת יְהֹוָה בָּרָה מְאִירַת עֵינָֽיִם׃

  יִרְאַת יְהֹוָה טְהוֹרָה עוֹמֶדֶת לָעַד מִֽשְׁפְּטֵי־יְהֹוָה אֱמֶת צָֽדְקוּ יַחְדָּֽו׃

  הַֽנֶּחֱמָדִים מִזָּהָב וּמִפַּז רָב וּמְתוּקִים מִדְּבַשׁ וְנֹפֶת צוּפִֽים׃

  גַּֽם־עַבְדְּךָ נִזְהָר בָּהֶם בְּשׇׁמְרָם עֵקֶב רָֽב׃

  שְׁגִיאוֹת מִֽי־יָבִין מִֽנִּסְתָּרוֹת נַקֵּֽנִי׃

  גַּם מִזֵּדִים חֲשֹׂךְ עַבְדֶּךָ אַֽל־יִמְשְׁלוּ־בִי אָז אֵיתָם וְנִקֵּיתִי מִפֶּשַֽׁע
  רָֽב׃

  יִהְיֽוּ־לְרָצוֹן אִמְרֵי־פִי וְהֶגְיוֹן לִבִּי לְפָנֶיךָ יְהֹוָה צוּרִי וְגֹאֲלִֽי׃ {פ}'
