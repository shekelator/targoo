  text: 'He who dwells in the shelter of the Most High rests in the shadow of the
    Almighty.

    I say to the LORD, "My refuge and my fortress, my God, in whom I trust."

    For he will deliver you from the fowler''s snare, from the deadly pestilence.

    He will cover you with his pinions, and under his wings you will find refuge;
    his faithfulness is a shield and buckler.

    You will not fear the terror of the night, nor the arrow that flies by day,

    nor the pestilence that stalks in darkness, nor the plague that destroys at noon.

    A thousand may fall at your side, ten thousand at your right hand, but it will
    not come near you.

    You will only look with your eyes and see the punishment of the wicked.

    Because you, O LORD, are my refuge, you have made the Most High your dwelling,

    no evil will befall you, and no plague will come near your tent.

    For he will command his angels concerning you, to guard you in all your ways.

    They will lift you up in their hands, so that you will not strike your foot against
    a stone.

    You will tread on the lion and the cobra; you will trample the young lion and
    the serpent.

    "Because he holds fast to me, I will deliver him; I will protect him, because
    he knows my name.

    He will call on me, and I will answer him; I will be with him in trouble, I will
    rescue him and honor him.

    With long life I will satisfy him and show him my salvation."'
