hebrew: 'תְּהִלָּה לְדָוִד אֲרוֹמִמְךָ אֱלוֹהַי הַמֶּלֶךְ וַאֲבָרְכָה שִׁמְךָ לְעוֹלָם
  וָעֶֽד׃

  בְּכׇל־יוֹם אֲבָרְכֶךָּ וַאֲהַלְלָה שִׁמְךָ לְעוֹלָם וָעֶֽד׃

  גָּדוֹל יְהֹוָה וּמְהֻלָּל מְאֹד וְלִגְדֻלָּתוֹ אֵין חֵֽקֶר׃

  דּוֹר לְדוֹר יְשַׁבַּח מַעֲשֶׂיךָ וּגְבוּרֹתֶיךָ יַגִּֽידוּ׃

  הֲדַר כְּבוֹד הוֹדֶךָ וְדִבְרֵי נִפְלְאֹתֶיךָ אָשִֽׂיחָה׃

  וֶעֱזוּז נֽוֹרְאֹתֶיךָ יֹאמֵרוּ (וגדלותיך) [וּגְדֻלָּתְךָ] אֲסַפְּרֶֽנָּה׃

  זֵכֶר רַב־טוּבְךָ יַבִּיעוּ וְצִדְקָתְךָ יְרַנֵּֽנוּ׃

  חַנּוּן וְרַחוּם יְהֹוָה אֶרֶךְ אַפַּיִם וּגְדׇל־חָֽסֶד׃

  טוֹב־יְהֹוָה לַכֹּל וְרַחֲמָיו עַל־כׇּל־מַעֲשָֽׂיו׃

  יוֹדוּךָ יְהֹוָה כׇּל־מַעֲשֶׂיךָ וַחֲסִידֶיךָ יְבָרְכֽוּכָה׃

  כְּבוֹד מַלְכוּתְךָ יֹאמֵרוּ וּגְבוּרָתְךָ יְדַבֵּֽרוּ׃

  לְהוֹדִיעַ לִבְנֵי הָאָדָם גְּבוּרֹתָיו וּכְבוֹד הֲדַר מַלְכוּתֽוֹ׃

  מַֽלְכוּתְךָ מַלְכוּת כׇּל־עֹלָמִים וּמֶֽמְשַׁלְתְּךָ בְּכׇל־דּוֹר וָדֹֽר׃

  סוֹמֵךְ יְהֹוָה לְכׇל־הַנֹּפְלִים וְזוֹקֵף לְכׇל־הַכְּפוּפִֽים׃

  עֵֽינֵי־כֹל אֵלֶיךָ יְשַׂבֵּרוּ וְאַתָּה נֽוֹתֵן־לָהֶם אֶת־אׇכְלָם בְּעִתּֽוֹ׃

  פּוֹתֵחַ אֶת־יָדֶךָ וּמַשְׂבִּיעַ לְכׇל־חַי רָצֽוֹן׃

  צַדִּיק יְהֹוָה בְּכׇל־דְּרָכָיו וְחָסִיד בְּכׇל־מַעֲשָֽׂיו׃

  קָרוֹב יְהֹוָה לְכׇל־קֹרְאָיו לְכֹל אֲשֶׁר יִקְרָאֻהוּ בֶאֱמֶֽת׃

  רְצוֹן־יְרֵאָיו יַעֲשֶׂה וְֽאֶת־שַׁוְעָתָם יִשְׁמַע וְיוֹשִׁיעֵֽם׃

  שׁוֹמֵר יְהֹוָה אֶת־כׇּל־אֹהֲבָיו וְאֵת כׇּל־הָרְשָׁעִים יַשְׁמִֽיד׃

  תְּהִלַּת יְהֹוָה יְֽדַבֶּר־פִּי וִיבָרֵךְ כׇּל־בָּשָׂר שֵׁם קׇדְשׁוֹ לְעוֹלָם וָעֶֽד׃ {פ}'
