hebrew: 'יְהֹוָה מָלָךְ גֵּאוּת לָבֵשׁ לָבֵשׁ יְהֹוָה עֹז הִתְאַזָּר אַף־תִּכּוֹן
  תֵּבֵל בַּל־תִּמּֽוֹט׃

  נָכוֹן כִּסְאֲךָ מֵאָז מֵעוֹלָם אָֽתָּה׃

  נָשְׂאוּ נְהָרוֹת יְֽהֹוָה נָשְׂאוּ נְהָרוֹת קוֹלָם יִשְׂאוּ נְהָרוֹת דׇּכְיָֽם׃

  מִקֹּלוֹת מַיִם רַבִּים אַדִּירִים מִשְׁבְּרֵי־יָם אַדִּיר בַּמָּרוֹם יְהֹוָֽה׃

  עֵֽדֹתֶיךָ נֶאֶמְנוּ מְאֹד לְבֵיתְךָ נַאֲוָה־קֹדֶשׁ יְהֹוָה לְאֹרֶךְ יָמִֽים׃ {פ}'
