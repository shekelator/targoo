hebrew: 'הַלְלוּ־יָהּ הַֽלְלוּ אֶת־שֵׁם יְהֹוָה הַֽלְלוּ עַבְדֵי יְהֹוָֽה׃

  שֶׁעֹמְדִים בְּבֵית יְהֹוָה בְּחַצְרוֹת בֵּית אֱלֹהֵֽינוּ׃

  הַֽלְלוּ־יָהּ כִּֽי־טוֹב יְהֹוָה זַמְּרוּ לִשְׁמוֹ כִּי נָעִֽים׃

  כִּֽי־יַעֲקֹב בָּחַר לוֹ יָהּ יִשְׂרָאֵל לִסְגֻלָּתֽוֹ׃

  כִּי אֲנִי יָדַעְתִּי כִּֽי־גָדוֹל יְהֹוָה וַאֲדֹנֵינוּ מִכׇּל־אֱלֹהִֽים׃

  כֹּל אֲשֶׁר־חָפֵץ יְהֹוָה עָשָׂה בַּשָּׁמַיִם וּבָאָרֶץ בַּיַּמִּים וְכׇל־תְּהֹמֽוֹת׃

  מַעֲלֶה נְשִׂאִים מִקְצֵה הָאָרֶץ בְּרָקִים לַמָּטָר עָשָׂה מֽוֹצֵא־רוּחַ מֵאֽוֹצְרוֹתָֽיו׃

  שֶׁהִכָּה בְּכוֹרֵי מִצְרָיִם מֵאָדָם עַד־בְּהֵמָֽה׃

  שָׁלַח אוֹתֹת וּמֹפְתִים בְּתוֹכֵכִי מִצְרָיִם בְּפַרְעֹה וּבְכׇל־עֲבָדָֽיו׃

  שֶׁהִכָּה גּוֹיִם רַבִּים וְהָרַג מְלָכִים עֲצוּמִֽים׃

  לְסִיחוֹן מֶלֶךְ הָאֱמֹרִי וּלְעוֹג מֶלֶךְ הַבָּשָׁן וּלְכֹל מַמְלְכוֹת כְּנָֽעַן׃

  וְנָתַן אַרְצָם נַחֲלָה נַחֲלָה לְיִשְׂרָאֵל עַמּֽוֹ׃

  יְהֹוָה שִׁמְךָ לְעוֹלָם יְהֹוָה זִכְרְךָ לְדֹר־וָדֹֽר׃

  כִּֽי־יָדִין יְהֹוָה עַמּוֹ וְעַל־עֲבָדָיו יִתְנֶחָֽם׃

  עֲצַבֵּי הַגּוֹיִם כֶּסֶף וְזָהָב מַעֲשֵׂה יְדֵי אָדָֽם׃

  פֶּֽה־לָהֶם וְלֹא יְדַבֵּרוּ עֵינַיִם לָהֶם וְלֹא יִרְאֽוּ׃

  אׇזְנַיִם לָהֶם וְלֹא יַאֲזִינוּ אַף אֵין־יֶשׁ־רוּחַ בְּפִיהֶֽם׃

  כְּמוֹהֶם יִהְיוּ עֹשֵׂיהֶם כֹּל אֲשֶׁר־בֹּטֵחַ בָּהֶֽם׃

  בֵּית יִשְׂרָאֵל בָּרְכוּ אֶת־יְהֹוָה בֵּית אַהֲרֹן בָּרְכוּ אֶת־יְהֹוָֽה׃

  בֵּית הַלֵּוִי בָּרְכוּ אֶת־יְהֹוָה יִֽרְאֵי יְהֹוָה בָּרְכוּ אֶת־יְהֹוָֽה׃

  בָּרוּךְ יְהֹוָה מִצִּיּוֹן שֹׁכֵן יְֽרוּשָׁלָ͏ִם הַֽלְלוּ־יָֽהּ׃ {פ}'
