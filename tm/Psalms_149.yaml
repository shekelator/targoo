passage_id: Psalms_149
style_version: 1
hebrew: 'הַלְלוּ־יָהּ שִׁירוּ לַֽיהֹוָה שִׁיר חָדָשׁ תְּהִלָּתוֹ בִּקְהַל חֲסִידִֽים׃

  יִשְׂמַח יִשְׂרָאֵל בְּעֹשָׂיו בְּנֵֽי־צִיּוֹן יָגִילוּ בְמַלְכָּֽם׃

  יְהַלְלוּ שְׁמוֹ בְמָחוֹל בְּתֹף וְכִנּוֹר יְזַמְּרוּ־לֽוֹ׃

  כִּֽי־רוֹצֶה יְהֹוָה בְּעַמּוֹ יְפָאֵר עֲנָוִים בִּישׁוּעָֽה׃

  יַעְלְזוּ חֲסִידִים בְּכָבוֹד יְרַנְּנוּ עַל־מִשְׁכְּבוֹתָֽם׃

  רוֹמְמוֹת אֵל בִּגְרוֹנָם וְחֶרֶב פִּיפִיּוֹת בְּיָדָֽם׃

  לַעֲשׂוֹת נְקָמָה בַּגּוֹיִם תּוֹכֵחוֹת בַּלְאֻמִּֽים׃

  לֶאְסֹר מַלְכֵיהֶם בְּזִקִּים וְנִכְבְּדֵיהֶם בְּכַבְלֵי בַרְזֶֽל׃

  לַעֲשׂוֹת בָּהֶם מִשְׁפָּט כָּתוּב הָדָר הוּא לְכׇל־חֲסִידָיו הַֽלְלוּ־יָֽהּ׃ {פ}'
