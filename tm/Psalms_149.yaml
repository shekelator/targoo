  text: 'Hallelujah! Sing to the LORD a new song; let his praise ring out in the assembly
    of the faithful.

    Let Israel rejoice in its maker; let the children of Zion exult in their king.

    Let them praise his name with dancing, and make music to him with tambourine and
    harp.

    For the LORD delights in his people; he adorns the humble with salvation.

    Let the faithful exult in glory; let them sing for joy on their beds.

    Let the high praises of God be in their throats, and a double-edged sword in their
    hands—

    to execute vengeance on the nations and punishment on the peoples,

    to bind their kings in chains and their nobles in iron fetters,

    to carry out the judgment written against them. This is the glory of all his faithful.
    Hallelujah!'
