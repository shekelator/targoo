  text: 'A psalm of praise by David. I will exalt you, my God and King, and bless
    your name forever and ever.

    Every day I will bless you and praise your name forever and ever.

    Great is the LORD and greatly to be praised; his greatness is unsearchable.

    One generation will commend your works to the next and declare your mighty acts.

    I will speak of the glorious splendor of your majesty and of your wondrous deeds.

    They will tell of the power of your awesome acts, and I will proclaim your greatness.

    They will pour forth the fame of your abundant goodness and sing aloud of your
    righteousness.

    The LORD is gracious and compassionate, slow to anger and rich in love.

    The LORD is good to all; his compassion rests on all he has made.

    All your works praise you, LORD, and your faithful ones bless you.

    They speak of the glory of your kingdom and tell of your might,

    to make known to all people his mighty acts and the glorious splendor of his kingdom.

    Your kingdom is an everlasting kingdom, and your dominion endures through all
    generations.

    The LORD upholds all who fall and lifts up all who are bowed down.

    The eyes of all look to you, and you give them their food in due season.

    You open your hand and satisfy the desire of every living thing.

    The LORD is righteous in all his ways and faithful in all he does.

    The LORD is near to all who call on him, to all who call on him in truth.

    He fulfills the desire of those who fear him; he hears their cry and saves them.

    The LORD watches over all who love him, but all the wicked he will destroy.

    My mouth will speak the praise of the LORD, and let all flesh bless his holy name
    forever and ever.'
