passage_id: Psalms_33
style_version: 1
hebrew: 'רַנְּנוּ צַדִּיקִים בַּֽיהֹוָה לַיְשָׁרִים נָאוָה תְהִלָּֽה׃

  הוֹדוּ לַיהֹוָה בְּכִנּוֹר בְּנֵבֶל עָשׂוֹר זַמְּרוּ־לֽוֹ׃

  שִֽׁירוּ־לוֹ שִׁיר חָדָשׁ הֵיטִיבוּ נַגֵּן בִּתְרוּעָֽה׃

  כִּֽי־יָשָׁר דְּבַר־יְהֹוָה וְכׇל־מַעֲשֵׂהוּ בֶּאֱמוּנָֽה׃

  אֹהֵב צְדָקָה וּמִשְׁפָּט חֶסֶד יְהֹוָה מָלְאָה הָאָֽרֶץ׃

  בִּדְבַר יְהֹוָה שָׁמַיִם נַעֲשׂוּ וּבְרוּחַ פִּיו כׇּל־צְבָאָֽם׃

  כֹּנֵס כַּנֵּד מֵי הַיָּם נֹתֵן בְּאוֹצָרוֹת תְּהוֹמֽוֹת׃

  יִֽירְאוּ מֵיְהֹוָה כׇּל־הָאָרֶץ מִמֶּנּוּ יָגוּרוּ כׇּל־יֹשְׁבֵי תֵבֵֽל׃

  כִּי הוּא אָמַר וַיֶּהִי הֽוּא־צִוָּה וַֽיַּעֲמֹֽד׃

  יְֽהֹוָה הֵפִיר עֲצַת־גּוֹיִם הֵנִיא מַחְשְׁבוֹת עַמִּֽים׃

  עֲצַת יְהֹוָה לְעוֹלָם תַּעֲמֹד מַחְשְׁבוֹת לִבּוֹ לְדֹר וָדֹֽר׃

  אַשְׁרֵי הַגּוֹי אֲשֶׁר־יְהֹוָה אֱלֹהָיו הָעָם בָּחַר לְנַחֲלָה לֽוֹ׃

  מִשָּׁמַיִם הִבִּיט יְהֹוָה רָאָה אֶֽת־כׇּל־בְּנֵי הָאָדָֽם׃

  מִֽמְּכוֹן־שִׁבְתּוֹ הִשְׁגִּיחַ אֶל כׇּל־יֹשְׁבֵי הָאָֽרֶץ׃

  הַיֹּצֵר יַחַד לִבָּם הַמֵּבִין אֶל־כׇּל־מַעֲשֵׂיהֶֽם׃

  אֵֽין־הַמֶּלֶךְ נוֹשָׁע בְּרׇב־חָיִל גִּבּוֹר לֹא־יִנָּצֵל בְּרׇב־כֹּֽחַ׃

  שֶׁקֶר הַסּוּס לִתְשׁוּעָה וּבְרֹב חֵילוֹ לֹא יְמַלֵּֽט׃

  הִנֵּה עֵין יְהֹוָה אֶל־יְרֵאָיו לַֽמְיַחֲלִים לְחַסְדּֽוֹ׃

  לְהַצִּיל מִמָּוֶת נַפְשָׁם וּלְחַיּוֹתָם בָּרָעָֽב׃

  נַפְשֵׁנוּ חִכְּתָה לַֽיהֹוָה עֶזְרֵנוּ וּמָגִנֵּנוּ הֽוּא׃

  כִּי־בוֹ יִשְׂמַח לִבֵּנוּ כִּי בְשֵׁם קׇדְשׁוֹ בָטָֽחְנוּ׃

  יְהִי־חַסְדְּךָ יְהֹוָה עָלֵינוּ כַּאֲשֶׁר יִחַלְנוּ לָֽךְ׃ {פ}'
