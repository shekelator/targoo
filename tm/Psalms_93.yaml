  text: 'The LORD reigns, robed in majesty; the LORD is robed, girded with strength.
    The world is established; it shall not be moved.

    Your throne is established from of old; you are from everlasting.

    The rivers have lifted up, O LORD, the rivers have lifted up their voice; the
    rivers lift up their roaring.

    Mightier than the thunder of many waters, mightier than the waves of the sea —
    the LORD on high is mighty.

    Your decrees are very trustworthy; holiness befits your house, O LORD, forevermore.'
