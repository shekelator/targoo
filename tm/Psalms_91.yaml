passage_id: Psalms_91
style_version: 1
hebrew: 'יֹשֵׁב בְּסֵתֶר עֶלְיוֹן בְּצֵל שַׁדַּי יִתְלוֹנָֽן׃

  אֹמַר לַיהֹוָה מַחְסִי וּמְצוּדָתִי אֱלֹהַי אֶבְטַח־בּֽוֹ׃

  כִּי הוּא יַצִּילְךָ מִפַּח יָקוּשׁ מִדֶּבֶר הַוּֽוֹת׃

  בְּאֶבְרָתוֹ יָסֶךְ לָךְ וְתַחַת־כְּנָפָיו תֶּחְסֶה צִנָּה וְסֹחֵרָה אֲמִתּֽוֹ׃

  לֹֽא־תִירָא מִפַּחַד לָיְלָה מֵחֵץ יָעוּף יוֹמָֽם׃

  מִדֶּבֶר בָּאֹפֶל יַהֲלֹךְ מִקֶּטֶב יָשׁוּד צׇהֳרָֽיִם׃

  יִפֹּל מִצִּדְּךָ אֶלֶף וּרְבָבָה מִימִינֶךָ אֵלֶיךָ לֹא יִגָּֽשׁ׃

  רַק בְּעֵינֶיךָ תַבִּיט וְשִׁלֻּמַת רְשָׁעִים תִּרְאֶֽה׃

  כִּֽי־אַתָּה יְהֹוָה מַחְסִי עֶלְיוֹן שַׂמְתָּ מְעוֹנֶֽךָ׃

  לֹא־תְאֻנֶּה אֵלֶיךָ רָעָה וְנֶגַע לֹא־יִקְרַב בְּאׇהֳלֶֽךָ׃

  כִּי מַלְאָכָיו יְצַוֶּה־לָּךְ לִשְׁמׇרְךָ בְּכׇל־דְּרָכֶֽיךָ׃

  עַל־כַּפַּיִם יִשָּׂאוּנְךָ פֶּן־תִּגֹּף בָּאֶבֶן רַגְלֶֽךָ׃

  עַל־שַׁחַל וָפֶתֶן תִּדְרֹךְ תִּרְמֹס כְּפִיר וְתַנִּֽין׃

  כִּי בִי חָשַׁק וַאֲפַלְּטֵהוּ אֲשַׂגְּבֵהוּ כִּֽי־יָדַע שְׁמִֽי׃

  יִקְרָאֵנִי וְֽאֶעֱנֵהוּ עִמּֽוֹ־אָנֹכִי בְצָרָה אֲחַלְּצֵהוּ וַאֲכַבְּדֵֽהוּ׃

  אֹרֶךְ יָמִים אַשְׂבִּיעֵהוּ וְאַרְאֵהוּ בִּישׁוּעָתִֽי׃ {פ}'
