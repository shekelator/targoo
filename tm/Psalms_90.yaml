hebrew: 'תְּפִלָּה לְמֹשֶׁה אִֽישׁ־הָאֱלֹהִים אֲֽדֹנָי מָעוֹן אַתָּה הָיִיתָ לָּנוּ
  בְּדֹר וָדֹֽר׃

  בְּטֶרֶם הָרִים יֻלָּדוּ וַתְּחוֹלֵֽל אֶרֶץ וְתֵבֵל וּֽמֵעוֹלָם עַד־עוֹלָם אַתָּה
  אֵֽל׃

  תָּשֵׁב אֱנוֹשׁ עַד־דַּכָּא וַתֹּאמֶר שׁוּבוּ בְנֵֽי־אָדָֽם׃

  כִּי אֶלֶף שָׁנִים בְּֽעֵינֶיךָ כְּיוֹם אֶתְמוֹל כִּי יַעֲבֹר וְאַשְׁמוּרָה בַלָּֽיְלָה׃

  זְרַמְתָּם שֵׁנָה יִהְיוּ בַּבֹּקֶר כֶּחָצִיר יַחֲלֹֽף׃

  בַּבֹּקֶר יָצִיץ וְחָלָף לָעֶרֶב יְמוֹלֵל וְיָבֵֽשׁ׃

  כִּי־כָלִינוּ בְאַפֶּךָ וּֽבַחֲמָתְךָ נִבְהָֽלְנוּ׃

  שַׁתָּ עֲוֺנֹתֵינוּ לְנֶגְדֶּךָ עֲלֻמֵנוּ לִמְאוֹר פָּנֶֽיךָ׃

  כִּי כׇל־יָמֵינוּ פָּנוּ בְעֶבְרָתֶךָ כִּלִּינוּ שָׁנֵינוּ כְמוֹ־הֶֽגֶה׃

  יְמֵֽי־שְׁנוֹתֵינוּ בָהֶם שִׁבְעִים שָׁנָה וְאִם בִּגְבוּרֹת שְׁמוֹנִים שָׁנָה וְרׇהְבָּם
  עָמָל וָאָוֶן כִּי־גָז חִישׁ וַנָּעֻֽפָה׃

  מִֽי־יוֹדֵעַ עֹז אַפֶּךָ וּכְיִרְאָתְךָ עֶבְרָתֶֽךָ׃

  לִמְנוֹת יָמֵינוּ כֵּן הוֹדַע וְנָבִא לְבַב חׇכְמָֽה׃

  שׁוּבָה יְהֹוָה עַד־מָתָי וְהִנָּחֵם עַל־עֲבָדֶֽיךָ׃

  שַׂבְּעֵנוּ בַבֹּקֶר חַסְדֶּךָ וּֽנְרַנְּנָה וְנִשְׂמְחָה בְּכׇל־יָמֵֽינוּ׃

  שַׂמְּחֵנוּ כִּימוֹת עִנִּיתָנוּ שְׁנוֹת רָאִינוּ רָעָֽה׃

  יֵרָאֶה אֶל־עֲבָדֶיךָ פׇעֳלֶךָ וַהֲדָרְךָ עַל־בְּנֵיהֶֽם׃

  וִיהִי נֹעַם אֲדֹנָי אֱלֹהֵינוּ עָלֵינוּ וּמַעֲשֵׂה יָדֵינוּ כּוֹנְנָה עָלֵינוּ
  וּֽמַעֲשֵׂה יָדֵינוּ כּוֹנְנֵֽהוּ׃ {פ}'
