[project]
name = "targoo"
version = "0.1.0"
description = "Bake-off harness comparing LLM providers for Hebrew→English translation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "jinja2",
    "pyyaml",
    "typer",
]

[project.scripts]
targoo = "targoo.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/targoo"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]