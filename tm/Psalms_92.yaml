  text: 'A psalm, a song for the Sabbath day.

    It is good to give thanks to the LORD and to sing praises to your name, O Most
    High;

    to declare your steadfast love in the morning and your faithfulness by night,

    with the ten-stringed lute and the harp, with music on the lyre.

    For you, LORD, have made me glad by your works; at the deeds of your hands I shout
    for joy.

    How great are your works, LORD! How very deep are your thoughts!

    A brutish man does not know, and a fool does not understand this:

    that when the wicked sprout like grass and all evildoers flourish, it is only
    to be destroyed forever.

    But you, LORD, are exalted on high forever.

    For behold, your enemies, LORD — for behold, your enemies shall perish; all evildoers
    shall be scattered.

    But you have raised my horn like that of a wild ox; I am anointed with fresh oil.

    My eye has looked upon my foes; my ears have heard of the doom of the wicked who
    rise against me.

    The righteous flourish like the palm tree and grow like a cedar of Lebanon.

    Planted in the house of the LORD, they flourish in the courts of our God.

    They still bear fruit in old age; they are ever full of sap and green,

    to declare that the LORD is upright — he is my rock, and there is no unrighteousness
    in him.'
