hebrew: 'מִזְמוֹר שִׁיר לְיוֹם הַשַּׁבָּֽת׃

  טוֹב לְהֹדוֹת לַיהֹוָה וּלְזַמֵּר לְשִׁמְךָ עֶלְיֽוֹן׃

  לְהַגִּיד בַּבֹּקֶר חַסְדֶּךָ וֶאֱמוּנָתְךָ בַּלֵּילֽוֹת׃

  עֲֽלֵי־עָשׂוֹר וַעֲלֵי־נָבֶל עֲלֵי הִגָּיוֹן בְּכִנּֽוֹר׃

  כִּי שִׂמַּחְתַּנִי יְהֹוָה בְּפׇעֳלֶךָ בְּֽמַעֲשֵׂי יָדֶיךָ אֲרַנֵּֽן׃

  מַה־גָּדְלוּ מַעֲשֶׂיךָ יְהֹוָה מְאֹד עָמְקוּ מַחְשְׁבֹתֶֽיךָ׃

  אִֽישׁ־בַּעַר לֹא יֵדָע וּכְסִיל לֹא־יָבִין אֶת־זֹֽאת׃

  בִּפְרֹחַ רְשָׁעִים כְּמוֹ־עֵשֶׂב וַיָּצִיצוּ כׇּל־פֹּעֲלֵי אָוֶן לְהִשָּׁמְדָם
  עֲדֵי־עַֽד׃

  וְאַתָּה מָרוֹם לְעֹלָם יְהֹוָֽה׃

  כִּי הִנֵּה אֹיְבֶיךָ יְֽהֹוָה כִּֽי־הִנֵּה אֹיְבֶיךָ יֹאבֵדוּ יִתְפָּרְדוּ כׇּל־פֹּעֲלֵי
  אָֽוֶן׃

  וַתָּרֶם כִּרְאֵים קַרְנִי בַּלֹּתִי בְּשֶׁמֶן רַעֲנָֽן׃

  וַתַּבֵּט עֵינִי בְּשׁוּרָי בַּקָּמִים עָלַי מְרֵעִים תִּשְׁמַעְנָה אׇזְנָֽי׃

  צַדִּיק כַּתָּמָר יִפְרָח כְּאֶרֶז בַּלְּבָנוֹן יִשְׂגֶּֽה׃

  שְׁתוּלִים בְּבֵית יְהֹוָה בְּחַצְרוֹת אֱלֹהֵינוּ יַפְרִֽיחוּ׃

  עוֹד יְנוּבוּן בְּשֵׂיבָה דְּשֵׁנִים וְֽרַעֲנַנִּים יִהְיֽוּ׃

  לְהַגִּיד כִּֽי־יָשָׁר יְהֹוָה צוּרִי וְֽלֹא־[עַוְלָתָה] (עלתה) בּֽוֹ׃ {פ}'
