  text: 'Hallelujah! For it is good to sing praise to our God; how pleasant and fitting
    is a song of praise.

    The LORD builds up Jerusalem; he gathers the outcasts of Israel.

    He heals the brokenhearted and binds up their wounds.

    He counts the number of the stars; he calls them all by name.

    Great is our Lord and mighty in power; his understanding has no limit.

    The LORD lifts up the humble; he casts the wicked down to the ground.

    Sing to the LORD with thanksgiving; make music to our God on the harp.

    He covers the sky with clouds; he prepares rain for the earth; he makes grass
    grow on the hills.

    He gives food to the animals, to the young ravens when they cry.

    He takes no pleasure in the strength of the horse; he has no delight in the legs
    of a man.

    The LORD takes pleasure in those who fear him, in those who hope in his steadfast
    love.

    Praise the LORD, O Jerusalem; praise your God, O Zion.

    For he has strengthened the bars of your gates; he has blessed your children within
    you.

    He makes peace your borders and satisfies you with the finest wheat.

    He sends his word to the earth; his command runs swiftly.

    He gives snow like wool; he scatters frost like ashes.

    He hurls down his hail like pebbles — who can stand before his cold?

    He sends his word and melts them; he makes his wind blow, and the waters flow.

    He declares his word to Jacob, his statutes and his judgments to Israel.

    He has not done this for any other nation; they do not know his judgments. Hallelujah!'
