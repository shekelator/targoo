hebrew: 'יְהוָה רֹעִי לֹא אֶחְסָר׃


  בִּנְאוֹת דֶּשֶׁא יַרְבִּיצֵנִי אֶל־מֵי מְנֻחוֹת יְנַהֲלֵנִי׃


  נַפְשִׁי יְשׁוֹבֵב יַנְחֵנִי לְמַעְלֵי צֶדֶק לְמַעַן שְׁמוֹ׃


  גַּם כִּי־אֵלֵךְ בְּגֵיא צַלְמָוֶת לֹא־אִירָא רָע כִּי־אַתָּה עִמָּדִי שִׁבְטְךָ
  וּמִשְׁעַנְךָ הֵמָּה יְנַחֲמֻנִי׃'
