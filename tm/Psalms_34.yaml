hebrew: 'לְדָוִד בְּשַׁנּוֹתוֹ אֶת־טַעְמוֹ לִפְנֵי אֲבִימֶלֶךְ וַיְגָרְשֵׁהוּ וַיֵּלַֽךְ׃

  אֲבָרְכָה אֶת־יְהֹוָה בְּכׇל־עֵת תָּמִיד תְּֽהִלָּתוֹ בְּפִֽי׃

  בַּיהֹוָה תִּתְהַלֵּל נַפְשִׁי יִשְׁמְעוּ עֲנָוִים וְיִשְׂמָֽחוּ׃

  גַּדְּלוּ לַיהֹוָה אִתִּי וּנְרוֹמְמָה שְׁמוֹ יַחְדָּֽו׃

  דָּרַשְׁתִּי אֶת־יְהֹוָה וְעָנָנִי וּמִכׇּל־מְגוּרוֹתַי הִצִּילָֽנִי׃

  הִבִּיטוּ אֵלָיו וְנָהָרוּ וּפְנֵיהֶם אַל־יֶחְפָּֽרוּ׃

  זֶה עָנִי קָרָא וַיהֹוָה שָׁמֵעַ וּמִכׇּל־צָרוֹתָיו הוֹשִׁיעֽוֹ׃

  חֹנֶה מַלְאַךְ־יְהֹוָה סָבִיב לִירֵאָיו וַֽיְחַלְּצֵֽם׃

  טַעֲמוּ וּרְאוּ כִּֽי־טוֹב יְהֹוָה אַֽשְׁרֵי הַגֶּבֶר יֶחֱסֶה־בּֽוֹ׃

  יְראוּ אֶת־יְהֹוָה קְדֹשָׁיו כִּי־אֵין מַחְסוֹר לִירֵאָֽיו׃

  כְּפִירִים רָשׁוּ וְרָעֵבוּ וְדֹרְשֵׁי יְהֹוָה לֹא־יַחְסְרוּ כׇל־טֽוֹב׃

  לְֽכוּ־בָנִים שִׁמְעוּ־לִי יִֽרְאַת יְהֹוָה אֲלַמֶּדְכֶֽם׃

  מִֽי־הָאִישׁ הֶחָפֵץ חַיִּים אֹהֵב יָמִים לִרְאוֹת טֽוֹב׃

  נְצֹר לְשׁוֹנְךָ מֵרָע וּשְׂפָתֶיךָ מִדַּבֵּר מִרְמָֽה׃

  סוּר מֵרָע וַעֲשֵׂה־טוֹב בַּקֵּשׁ שָׁלוֹם וְרׇדְפֵֽהוּ׃

  עֵינֵי יְהֹוָה אֶל־צַדִּיקִים וְאׇזְנָיו אֶל־שַׁוְעָתָֽם׃

  פְּנֵי יְהֹוָה בְּעֹשֵׂי רָע לְהַכְרִית מֵאֶרֶץ זִכְרָֽם׃

  צָעֲקוּ וַיהֹוָה שָׁמֵעַ וּמִכׇּל־צָרוֹתָם הִצִּילָֽם׃

  קָרוֹב יְהֹוָה לְנִשְׁבְּרֵי־לֵב וְֽאֶת־דַּכְּאֵי־רוּחַ יוֹשִֽׁיעַ׃

  רַבּוֹת רָעוֹת צַדִּיק וּמִכֻּלָּם יַצִּילֶנּוּ יְהֹוָֽה׃

  שֹׁמֵר כׇּל־עַצְמוֹתָיו אַחַת מֵהֵנָּה לֹא נִשְׁבָּֽרָה׃

  תְּמוֹתֵת רָשָׁע רָעָה וְשֹׂנְאֵי צַדִּיק יֶאְשָֽׁמוּ׃

  פֹּדֶה יְהֹוָה נֶפֶשׁ עֲבָדָיו וְלֹא יֶאְשְׁמוּ כׇּֽל־הַחֹסִים בּֽוֹ׃ {פ}'
