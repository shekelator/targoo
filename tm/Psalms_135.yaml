  text: 'Hallelujah! Praise the name of the LORD; praise him, servants of the LORD,

    who stand in the house of the LORD, in the courts of our God''s house.

    Praise the LORD, for the LORD is good; sing to his name, for it is lovely.

    For the LORD chose Jacob for himself, Israel as his own treasure.

    For I know that the LORD is great, and that our Lord is above all gods.

    Whatever the LORD pleases, he does — in the heavens and on the earth, in the seas
    and all the depths.

    He raises clouds from the ends of the earth, makes lightning for the rain, and
    brings the wind out of his storehouses.

    He struck down the firstborn of Egypt, both human and animal.

    He sent signs and wonders into your midst, O Egypt, against Pharaoh and all his
    servants.

    He struck down many nations and slew mighty kings —

    Sihon king of the Amorites, and Og king of Bashan, and all the kingdoms of Canaan
    —

    and gave their land as a heritage, a heritage to Israel his people.

    O LORD, your name endures forever; O LORD, your renown lasts through all generations.

    For the LORD will vindicate his people and have compassion on his servants.

    The idols of the nations are silver and gold, the work of human hands.

    They have mouths but cannot speak; they have eyes but cannot see.

    They have ears but cannot hear; there is no breath in their mouths.

    Those who make them will become like them — so will all who trust in them.

    House of Israel, bless the LORD; house of Aaron, bless the LORD.

    House of Levi, bless the LORD; you who fear the LORD, bless the LORD.

    Blessed be the LORD from Zion, who dwells in Jerusalem. Hallelujah!'
