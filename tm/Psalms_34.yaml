  text: 'Of David, when he feigned madness before Abimelech, who drove him away, and
    he departed.


    I will bless the LORD at all times; his praise will always be on my lips.

    My soul boasts in the LORD; let the humble hear and rejoice.

    Glorify the LORD with me; let us exalt his name together.

    I sought the LORD, and he answered me and delivered me from all my fears.

    Those who look to him are radiant, and their faces will not be ashamed.

    This poor man cried out, and the LORD heard him and saved him from all his troubles.

    The angel of the LORD encamps around those who fear him and rescues them.

    Taste and see that the LORD is good; blessed is the man who takes refuge in him.

    Fear the LORD, you his holy ones, for those who fear him lack nothing.

    Young lions go hungry and starve, but those who seek the LORD lack no good thing.

    Come, children, listen to me; I will teach you the fear of the LORD.

    Who is the man who desires life, who loves long days to see good?

    Guard your tongue from evil and your lips from speaking deceit.

    Turn from evil and do good; seek peace and pursue it.

    The eyes of the LORD are on the righteous, and his ears are open to their cry.

    The face of the LORD is against those who do evil, to cut off all memory of them
    from the earth.

    They cried out, and the LORD heard them and delivered them from all their troubles.

    The LORD is near to the brokenhearted and saves those who are crushed in spirit.

    Many are the troubles of the righteous, but the LORD delivers him from them all.

    He guards all his bones; not one of them is broken.

    Evil will bring death to the wicked, and those who hate the righteous will be
    condemned.

    The LORD redeems the lives of his servants; none who take refuge in him will be
    condemned.'
