# Provider settings for the bake-off. Never put secrets in this file.
temperature: 0.2          # draft sampling temperature — Ollama providers only;
                          # current Claude families don't accept temperature at all
max_tokens: 8000          # draft output ceiling per passage

providers:
  bedrock:
    kind: bedrock         # Claude on AWS via Bedrock (bedrock-runtime client)
    # Account access (checked 2026-10 via list-inference-profiles): sonnet-4-6,
    # opus-4-6, haiku-4-5. The 5.x/Fable ids 403 for this account. Use the
    # us.anthropic.* inference-profile form — plain ids fail on-demand
    # throughput validation.
    model: us.anthropic.claude-sonnet-4-6
    aws_region: us-east-1
    # effort: medium      # optional response-depth knob (low..max) — the Bedrock
    #                     # equivalent of temperature tuning for current models

  ollama-cloud:
    kind: ollama          # Ollama Cloud (https://ollama.com)
    base_url: https://ollama.com
    model: gemma4:31b-cloud               # exact tag per your `ollama list`
    api_key_env: OLLAMA_API_KEY
    timeout_seconds: 180

  dicta-local:
    kind: ollama          # local Ollama daemon
    base_url: http://127.0.0.1:11434
    model: dicta-il/DictaLM-3.0-1.7B-Thinking:latest
    timeout_seconds: 900   # DictaThinking takes ~6 min on a 20KB passage (GPU, warm)

# Provider that judges the drafts. It only ever sees letter labels (A/B/C),
# never model names, so the judge stays blind too.
judge: bedrock